name: GIO Android Source Pack 12
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gio-source-pack.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PACK_ID: '12'
      PACK_COUNT: '16'
      SOURCEPACK_GENERATION: 'v2-20260902'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Execute pinned public pack worker v2
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/giovannifidel-collab/pfarma-ci/a003ef2e563e742ddfab609ac6af012309740f15/razzo/gio_os_build/source_pack_worker_v2.sh -o /tmp/gio-pack.sh
          sha256sum /tmp/gio-pack.sh
          bash /tmp/gio-pack.sh
